<script>

    let array = getParam();
    // 获取 url 参数
    function getParam(){
        // http://127.0.0.1:8080/online_oj/reviewDetail.html?id=1&usernsame=8
        let param = location.search;
        let qs = (param.length > 0 ? param.substring(1): '');

        // 保存数据的对象
        let array = [];

        let items = (qs.length > 0 ? qs.split('&') : []);
        // 将每一个添加到 array 中
        for (item of items) {
            let ob = item.split('=');
            array[ob[0]] = ob[1];
        }
        return array;
    }

</script>

<!-- 代码编辑框 -->
<script>
    // location.search 获取queryString部分（即 ?...）
    // console.log(location.search);

    // 1.初始化代码编辑框
    function initAce() {
        // 参数 editor 就对应到刚才在 html 里加的那个 div 的 id
        let editor = ace.edit("editor");
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableSnippets: true,
            enableLiveAutocompletion: true
        });
        editor.setTheme("ace/theme/twilight");
        editor.session.setMode("ace/mode/java");
        editor.resize();
        document.getElementById('editor').style.fontSize = '16px';

        return editor;
    }
    let editor = initAce();

     // 2. 提交程序
     function submit(){
        let subCode = editor.getValue();

        if(subCode == ''){
            alert('代码为空，请输入！！');
            return;
        }

        let body = {
            id: array['id'],
            code: subCode
        }

        let display = document.querySelector('.display');
        $.ajax({
            url: 'submit',
            method: 'POST',
            data: JSON.stringify(body),
            success: function(data, status){
                mergeCurrentRecord(data);
            }
        });
    }

    // 3. 拼装当前提交结果的模板
    function mergeCurrentRecord(data){
        $('.current-record').attr({
            'style': 'display: block'
        });

        $('.grade').attr({
            'style': 'display: none'
        });

        $('.current-record-error').html(data.reason);
        $('#current-record-passcount').html(data.passExampleCount);
        $('#current-record-input').html(data.finalInput);
        $('#current-record-output').html(data.output);
        $('#current-record-preoutput').html(data.preOutput);
        $('#current-record-finaloutput').html(data.finalInput);

        let className = null;
        let result = null;
        let judge = null;

        if(data.error == 1){
            className = '.complieerror';
            result = '编译错误';
            judge = 'error';
        } else if(data.error == 2){
            className = '.runerror';
            result = '运行错误';
            judge = 'error';
        } else if(data.error == 3){
            className = '.passerror';
            result = '解答错误';
            judge = 'error';
        } else if(data.error == 0){
            className = '.passall';
            result = '通过';
            judge = 'right';
        }

        $(className).attr({
            'style': 'display: block'
        });

        $('#current-result').text(result);
        $('#current-result').attr({
            'class': 'current-result-' + judge
        });

        records();
    }


    // 4. 重置代码模板
    function reset(){
        if(confirm('确定要初始化代码?')){
            editor.setValue(templatecode);
        }
    }
    
</script>

<script>
    getProblem();
    function describe(){
        $('.review').attr({
            'style': 'display: none'
        });

        $('.settlement').attr({
            'style': 'display: none'
        });

        $('.record').attr({
            'style': 'display: none'
        })

        $('.description').attr({
            'style': 'display: block'
        });

        getProblem();
    }

    // 调用函数
    // getProblem();

    // 1. 向服务器发送请求，获取题目详情
    let templatecode = null;
    function getProblem(){
        $.ajax({
            url: 'problem' + location.search,
            method: 'GET',
            success: function(data, status, resp){
                console.log("book1");
                if(resp.getResponseHeader('REDIRECT') == 'true'){
                    console.log("book2");
                    window.location.href = resp.getResponseHeader('SENDPATH');
                    return;
                }

                

                if(resp.getResponseHeader('ERRORREASON') != null){
                    console.log(resp.getResponseHeader('ERRORREASON'));
                    alert(decodeURI(resp.getResponseHeader('ERRORREASON')));
                    return;
                } 

                templatecode = data.templatecode;
                makeProblemDetail(data);
            }
            
        });
    }

    // 2. 完善前端页面
    function makeProblemDetail(data){
        let h3 = document.querySelector('.description h3');
        h3.innerHTML = data.id + '.' + data.title;

        // 修改 head-title 的名字
        $('head title').text(data.id + '.' + data.title + '-' + 'Online Judge');

        let level = document.querySelector('.level');
        level.innerHTML = data.level;

        let p = document.querySelector('.description p');
        p.innerHTML = data.description;

        $('#current-record-allcase').text(data.testExample);

        // let textarea = document.querySelector('.code textarea');
        // textarea.innerText = data.templatecode;
        editor.setValue(templatecode);
    }
</script>

    function getCount(){
        let num = 0;

            url: './problemreviewcount?problemId=' + array['id'],
            method: 'get',
            async: false,
            success: function(data, status){
                num = data.count;
            }

    function submitreview(){
        if($.trim( $('#first-write-one textarea').val() ) == ''){
            alert('评论不可以为空!!!');
            return;
        }
        let data = {
            problemId: array['id'],
            content: $('#first-write-one textarea').val()
        }

        $.ajax({
            url: './submitproblemreview',
            method: 'post',
            contentType: 'application/json;charset=utf8',
            data: JSON.stringify(data),
            success: function(data, status){
                alert('发布成功!!!');

                // 更新总评论数
                let reviewCount = getCount();
                $('#count').text(reviewCount);

                // 查看所有一级评论
                getReview();
                
            }
        });

            editormd.markdownToHTML(review.id + '-review-describe', {

            });

    // 3. 查看某个一级评论拥有的二级评论的数量
    function secReviewCount(reviewId) {
        let num = 0;
        $.ajax({
            url: './problemreview?problemId=' + array['id'] + '&' + 'underId=' + reviewId,
            method: 'get',
            async:false,
            success: function(data, status){

    let display = 'block';
    function addReview(reviewId){
        $('.addreview-two').attr({
            'style': 'display: none'
        });
        $('#' + reviewId + '-addreview').attr({
            'style': 'display: ' + display
        });

        } else {
            display = 'block';
        }

    // 5. 设置一个函数，用于拼装评论输入框
    // 这里的 reviewId 就相当于是 sendTo, 如果是一级评论的话 underId == sendTo; 如果是二级评论的话, underId != sendTo
    // 
    function makeInput(underId, sendTo){
        let addReview = $('<div>');
        addReview.addClass('addreview-two');
        addReview.attr({
            'id': sendTo + '-addreview',
            'style': 'display: none'
        });

        let write_one = $('<div>');
        write_one.attr({
            'id': sendTo + '-write-one',
            'style': 'display: block; margin-bottom: 5px',
            'class': 'write-one'
        });
        let textarea_one = $('<textarea>');
        textarea_one.attr({
            'style': 'display:none'
        });
        write_one.append(textarea_one);
        addReview.append(write_one);

        let write_two = $('<div>');
        write_two.attr({
            'id': sendTo + '-write-two',
            'style': 'display: none',
            'class': 'write-two'
        });
        let textarea_two = $('<textarea>');
        textarea_two.attr({
            'style': 'display:none'
        });
        write_two.append(textarea_two);
        addReview.append(write_two);

        let div = $('<div>');

        let writing = $('<a>');
        writing.attr({
            'class': 'writing',
            'href': '#',
            'onclick': 'getWrite(' + sendTo + ')'
        });
        writing.text('编辑');
        div.append(writing);

        let read = $('<a>');
        read.attr({
            'class': 'read',
            'href': '#',
            'onclick': 'preRead(' + sendTo + ')'
        });
        read.text('预览');
        div.append(read);

        let submit = $('<a>');
        submit.attr({
            'class': 'submitreview',
            'href': '#',
            'onclick': 'submitreviewTwo(' + underId + ',' +  sendTo + ')'
        });
        submit.text('提交');
        div.append(submit);

        addReview.append(div);
        return addReview;
    }

    // 6. 预览功能
    function preRead(reviewId){
        let oneId = reviewId + '-write-one';
        let twoId = reviewId + '-write-two';

        if( $('#' + twoId).attr('style') == 'display:block' ){
            return;
        }
        $('#' + twoId).html('');


        $('#' + oneId).attr({
            'style': 'display:none'
        });
        $('#' + twoId).attr({
            'style': 'display:block'
        });

        let value = $('#' + oneId + ' ' + 'textarea').val();

        editormd.markdownToHTML(twoId, {
            markdown: value
        });
    }

    // 7. 编辑功能
    function getWrite(reviewId){
        let oneId = reviewId + '-write-one';
        let twoId = reviewId + '-write-two';

        if(reviewId == 'first'){
            $('#' + oneId).attr({
                'style': 'display: block'
            }); 
        } else {
            $('#' + oneId).attr({
                'style': 'display: block; margin-bottom: 5px; width: 100%; height: 100px'
            });
        }
        $('#' + twoId).attr({
            'style': 'display:none'
        });
    }

    // 8. 提交二级评论
    function submitreviewTwo(underId, sendTo){
        let content = null;

        console.log(underId);
        console.log(sendTo);
        
        if(underId == sendTo){
            content = $('#' + underId + '-write-one' + ' ' + 'textarea').val();
        } else {
            content = $('#' + sendTo + '-write-one' + ' ' + 'textarea').val();
        }

        let data = {
            content: content,
            problemId: array['id'],
            underId: underId,
            sendTo: sendTo
        };

        $.ajax({
            url: './submitproblemreview',
            method: 'post',
            data: JSON.stringify(data),
            success: function(data, status){
                alert('评论成功!!');
        
                enlargeReview(underId, true);

                // 更新总评论数
                let reviewCount = getCount();
                $('#count').text(reviewCount);

                // 由于实在找不到有效的方法使提交后的输入框清空，出此下策
                $('#' + sendTo + '-addreview').remove();
                let addReview = makeInput(underId, sendTo);
                if(underId == sendTo){
                    $('#' + underId + ' ' + '.answer').after(addReview);
                } else {
                    $('#' + sendTo + '-answer').after(addReview);

                    console.log($('#' + sendTo + '-answer'));
                }
                var write_one_editor = editormd(sendTo + '-write-one', {
                    width: '100%',
                    height: "100px",
                    markdown: "",
                    path: "editor2.md/lib/",
                    saveHTMLToTextArea:true,
                    emoji: true,
                    watch: false,
                    lineNumbers:false,
                });
                $('.editormd-markdown-textarea').attr    ({'placeholder': ''});
                }
        });

    }
</script>

<!-- 提交记录 -->
<script>
    function records(){
        $('.description').attr({
            'style': 'display: none'
        });

        $('.review').attr({
            'style': 'display: none'
        });

        $('.settlement').attr({
            'style': 'display: none'
        });

        $('.record').attr({
            'style': 'display: block'
        });

        getRecord();
    }
    
    function getRecord(){
        $('.record-one').remove();
        $.ajax({
            url: './problemrecord?problemId=' + array['id'],
            method: 'get',
            success: function(data, status){
                mergeRecord(data);
            }
        });
    }

    function mergeRecord(data){
        let record_list = $('.all-record');

        let isGrey = true;
        for (record of data) {
            let record_one = $('<div>');
            let color = isGrey == true ? 'grey' : 'white';
            record_one.attr({
                'class': 'record-one' + ' ' + color,
            });
            isGrey = !isGrey;

            let record_result = $('<a>');
            let result = record.status == 0 ? 'success' : 'error';
            record_result.attr({
                'class': 'record-result' + ' ' + result,
                'href': 'recordDetail.html?id=' + record.id,
                'target': '_blank'
            });
            let text = null;

            if(record.status == 0){
                text = '通过';
            } else if(record.status == 1){
                text = '编译出错';
            } else if(record.status == 2){
                text = '运行出错';
            } else {
                text = '解答错误';
            }

            record_result.text(text);

            record_one.append(record_result);

            let time = $('<span>');
            time.addClass('record-time');
            time.text(record.time);
            record_one.append(time);

            record_list.append(record_one);
        }
    }

</script>

<!-- 睡眠函数 -->
<script>
    function sleeping(n){
        let start = new Date().getTime();
        while(true){
            if((new Date().getTime() - start) > n){
                break;
            }
        }
    }
</script>

<!-- 搜索题解 -->
<script>
    function searching(){
        let query = $('.settlement-search-input').val();
        if($.trim(query) == ''){
            alert('搜索内容不规范!!!');
            $('.settlement-search-input').focus();
            return;
        }

        $('#loading').attr({
            'style': 'display: block'
        });
        
        // 为什么用post方法，如果用get，将query放在QueryString中，有些符号会无法识别，比如 #
        let data = {
            'problemId': array['id'],
            'query': query
        }

        $.ajax({
            url: './searchersettle',
            method: 'post',
            contentType: 'application/json;charset=utf8',
            data: JSON.stringify(data),
            success: function(data, status){
                $('.settlement-list').empty();

                if(data.length == 0){
                    let noResult = $('<div>');
                    noResult.text('没有找到相应的搜索结果...');
                    noResult.css({
                        'font-size': '20px'
                    });
                    $('.settlement-list').append(noResult);
                } else {
                    mergeSettlement(data);
                }
                sleeping(1000);
                $('#loading').attr({
                    'style': 'display: none'
                });

            }
        });
    }
</script>
