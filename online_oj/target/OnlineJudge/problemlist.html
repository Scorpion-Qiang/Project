<!-- 进入这个页面，就执行<script>中的语句 -->
<script>

    // 调用 getProblem 函数，函数调用和函数定义无顺序的
    getProblem();
    function getProblem(){
       $.ajax({
        url: './problem',
        method: 'GET',
        success: function(data, status, resp){
            if(resp.getResponseHeader('REDIRECT') == 'true'){
                location.href = resp.getResponseHeader('SENDPATH');
            }
            makeProblemList(data);
        }
        
       }); 
    }

    // 将响应拼接称 table
    function makeProblemList(data){
        let tbody = document.querySelector('#tbody');

        for (problem of data) {
            let tr = document.createElement('tr');
            tr.className = 'row';

            let tdId = document.createElement('td');
            tdId.className = 'id';
            tdId.innerHTML = problem.id;
            tr.appendChild(tdId);

            let tdTitle = document.createElement('td');
            tdTitle.className = 'title';
            let a = document.createElement('a');
            a.href = 'problemDetail.html?id=' + problem.id;
            a.innerHTML = problem.title;
            a.target = '_blank';
            tdTitle.appendChild(a);
            tr.appendChild(tdTitle);

            let tdLevel = document.createElement('td');
            if(problem.level == '简单'){
                tdLevel.className = 'level easy';
            }
            if(problem.level == '中等'){
                tdLevel.className = 'level medium';
            }
            if(problem.level == '困难'){
                tdLevel.className = 'level hard';
            }
            tdLevel.innerHTML = problem.level;
            tr.appendChild(tdLevel);

            let status = document.createElement('td');
            let statusClass = '';
            let statusText = '';
            if(problem.status == 0){
                statusClass = 'pass';
                statusText = '√';
            } else if(problem.status == 1){
                statusClass = 'error';
                statusText = '×';
            }
            status.className = 'status ' + statusClass;
            status.innerHTML = statusText;
            tr.appendChild(status);

            tbody.appendChild(tr);
        }
    }



</script>


<!-- 休眠函数 -->
<script>
    function sleeping(n){
        let start = new Date().getTime();
        while(true){
            if((new Date().getTime() - start) > n){
                break;
            }
        }
    }
</script>

<!-- 搜索处理 -->
<script>
    function searcher(){
        let query = $('#query').val();
        if($.trim(query) == ''){
            alert('搜索内容不可以为空!!!');
            $('#query').focus();
            return;
        }

        $('#loading').attr({
            'style': 'display: block'
        });

        let data = {
            'query': query
        }

        $.ajax({
            url: './searcherproblem',
            method: 'post',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(data, status){
                $('#tbody').empty();

                if(data.length == 0){
                    $('.table .row').attr({
                        'style': 'display: none'
                    });

                    $('#no-result').attr({
                        'style': 'display: block'
                    });
                } else {
                    $('.table .row').attr({
                        'style': ''
                    });

                    $('#no-result').attr({
                        'style': 'display: none'
                    });
                    makeProblemList(data);
                }

                sleeping(1000);
                $('#loading').attr({
                    'style': 'display: none'
                });
            }
        })
    }
</script>

</html>
