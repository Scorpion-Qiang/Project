<script>

    let array = getParam();
    // 获取 url 参数
    function getParam(){
        // http://127.0.0.1:8080/online_oj/reviewDetail.html?id=1&usernsame=8
        let param = location.search;
        let qs = (param.length > 0 ? param.substring(1): '');

        // 保存数据的对象
        let array = [];

        let items = (qs.length > 0 ? qs.split('&') : []);
        // 将每一个添加到 array 中
        for (item of items) {
            let ob = item.split('=');
            array[ob[0]] = ob[1];
        }
        return array;
    }

</script>


<script>

    // 1. 更新一级评论的详细信息
    getSettlementDetail();
    // (1). 发送请求
    function getSettlementDetail(){
        $.ajax({
            url: './settledetail' + location.search,
            type: 'get',
            success: function(data, status, resp){
                if(resp.getResponseHeader('REDIRECT') == 'true'){
                    location.href = resp.getResponseHeader('SENDPATH');
                    return;
                }

                if(resp.getResponseHeader('ERRORREASON') != null){
                    alert(decodeURI(resp.getResponseHeader('ERRORREASON')));
                    return;
                } 

                mergeSettlement(data);
            },
        });
    }
    // (2). 更新一级评论的详细信息
    function mergeSettlement(data){

        let docu_title = $('head title');
        docu_title.text(data.title + '-Online Judge');

        $('#settle-detail-a').attr({
            'href': './userDetail.html?username=' + data.username,
            'target': '_blank'
        });

        $('.settle-detail-myphoto').attr({
            'src': './image/' + data.userphoto,
            'title': data.username
        });
        
        $('.settle-detail-title').text(data.title);
        $('.settle-detail-time').text(data.time);

        $('#settle-detail-content').text('');
        // 调用一个editormd的 markdownToHTML方法
        // 需要引入editor.md的js
        editormd.markdownToHTML('settle-detail-content',
        {
            markdown: data.content,
        });
        
    }
</script>

        $.ajax({

            async: false,

        let data = {
            settleId: array['id'],
            content: $('#first-write-one textarea').val()

        $.ajax({
            url: './submitsettlereview',
            method: 'post',
            contentType: 'application/json;charset=utf8',

            front.append(username);

            first.append(front);

            let time = $('<div>');
            time.addClass('review-time');
            time.text(review.time);
            first.append(time);

            list_one.append(first);

            let content = $('<div>');
            content.addClass('review-content');
            content.attr({
                'id': review.id + '-review-content',
                'style': 'background-color: transparent; font-size: 18px;font-family: STKaiti; padding: 0px'
            })
            let textarea = $('<textarea>');
            textarea.css({
                'display': 'none'
            });
            content.append(textarea);
            list_one.append(content);

            let a_enlarge = $('<a>');
            a_enlarge.addClass('enlarge');
            let num = secReviewCount(review.id);
            a_enlarge.text('共' + num + '条回复');
            a_enlarge.attr({
                'href': '#',
                'onclick': 'enlargeReview(' + review.id + ', false' + ')'
            });
            list_one.append(a_enlarge);

            let a_answer = $('<a>');
            a_answer.addClass('answer');

            a_answer.attr({
                'href': '#',

            });
            list_one.append(a_answer);

            let addReview = makeInput(review.id, review.id);
            list_one.append(addReview);


            review_list.append(list_one);

            editormd.markdownToHTML(review.id + '-review-content', {
                markdown: review.content
            });

            let id = review.id + '-write-one';
            var write_one_editor = editormd(id, {
                width: '100%',
                height: "100px",
                markdown: "",
                path: "editor2.md/lib/",
                saveHTMLToTextArea:true,
                emoji: true,
                watch: false,
                lineNumbers:false,
            });
            $('.editormd-markdown-textarea').attr    ({'placeholder': ''});
        }
    }


    // 2. 查看二级评论
    // update==true，表示提交评论后，展示二级评论（不会收起）
    // update==false，表示用户正常展示、收起评论
    function enlargeReview(reviewId, update){
        if( ($('#' + reviewId + ' ' + '.enlarge').text() == '收起评论') && (update == false) ){

            $('#' + reviewId + ' ' + '.review-answer-list').remove();

            let num = secReviewCount(reviewId);
            $('#' + reviewId + ' ' + '.enlarge').text('共' + num + '条回复');

            return;
        }

        $('#' + reviewId + ' ' + '.review-answer-list').remove();

        $('#' + reviewId + ' ' + '.enlarge').text('收起评论');

        $.ajax({
            url: './settlereview?settleId=' + array['id'] + '&' + 'underId=' + reviewId,
            method: 'get',
            success: function(data, status){
                mergeEnlargeReview(data, reviewId);
            }
        });
    }

            first.append(time);

            answer_one.append(first);

            let content = $('<div>');

    // 6. 预览功能
    function preRead(reviewId){
        let oneId = reviewId + '-write-one';

        if( $('#' + twoId).attr('style') == 'display:block' ){
            return;
        }
        $('#' + twoId).html('');


        $('#' + oneId).attr({
            'style': 'display:none'
        });
        $('#' + twoId).attr({
            'style': 'display:block'
        });

        let value = $('#' + oneId + ' ' + 'textarea').val();
        console.log(value);
        editormd.markdownToHTML(twoId, {
            markdown: value
        });
    }

    // 7. 编辑功能
    function getWrite(reviewId){
        let oneId = reviewId + '-write-one';
        let twoId = reviewId + '-write-two';

        if(reviewId == 'first'){
            $('#' + oneId).attr({
                'style': 'display: block'
            }); 
        } else {
            $('#' + oneId).attr({
                'style': 'display: block; margin-bottom: 5px; width: 100%; height: 100px'
            });
        }

        $('#' + twoId).attr({
            'style': 'display:none'
        });
    }

    // 8. 提交二级评论
    function submitreviewTwo(underId, sendTo){
        let content = null;

        console.log(underId);
        console.log(sendTo);
        
        if(underId == sendTo){
            content = $('#' + underId + '-write-one' + ' ' + 'textarea').val();
        } else {
            content = $('#' + sendTo + '-write-one' + ' ' + 'textarea').val();
        }

        let data = {
            content: content,
            settleId: array['id'],
            underId: underId,
            sendTo: sendTo
        };

        $.ajax({
            url: './submitsettlereview',
            method: 'post',
            data: JSON.stringify(data),
            success: function(data, status){
                alert('评论成功!!');
        
                enlargeReview(underId, true);

                $('#' + sendTo + '-addreview').remove();

                if(underId == sendTo){
                    $('#' + underId + ' ' + '.answer').after(addReview);
                } else {
                    $('#' + sendTo + '-answer').after(addReview);

                    console.log($('#' + sendTo + '-answer'));

                var write_one_editor = editormd(sendTo + '-write-one', {

                    saveHTMLToTextArea:true,
                    emoji: true,

                    lineNumbers:false,
                });
                $('.editormd-markdown-textarea').attr    ({'placeholder': ''});
                }
        });
